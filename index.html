<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
 
    <form onsubmit="return data()" action="thanku.html">
        <h1 style="font-family: Arial, Helvetica, sans-serif;font-size: 30px;color: blueviolet;"> Registration Form</h1>
        <div style="font-size: 30px;;justify-content:space-between;">
            <label for="name">Name</label><br>
            <input type="text" id="name" placeholder="Enter your Username"><br>
            <label for="phone">Phone no.</label><br>
            <input type="tel" id="phoneno" placeholder="Enter your phoneno"><br>
            <label for="email">Email</label><br>
            <input type="email" id="email" placeholder="Enter your email"><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" placeholder="Enter your passwoed"><br>
            <label for="confirm-password">Confirm Password</label><br>
            <input type="password" id="confirm-password" placeholder="Confirm password">
        </div><br>
    <div>
        <button type="submit" style="display: flex;font-size: 30px;color: white;background-color: cornflowerblue;border-radius: 10px;border: 2px solid #013a9f;">Submit</button>
    </div>
<div>
    <script src="java.js"></script>
</div>

    </form>
   
</body>
</html>
